<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logged out — Note Craft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1E2A22; font-family: "IBM Plex Sans", sans-serif; color: #F7F1E3;
    }
    .card {
      background: #F7F1E3; color: #201E17; padding: 2.5rem; border-radius: 14px;
      max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { font-family: "Fraunces", serif; font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    a {
      display: inline-block; background: #1E2A22; color: #F7F1E3; text-decoration: none;
      padding: 0.6rem 1.3rem; border-radius: 8px; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You've been logged out</h1>
    <p>Your session ended. Your notes are safe and waiting for you.</p>
    <a href="/login">Log back in</a>
  </div>
</body>
</html>
